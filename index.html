<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 360 con A-Frame</title>
    <!-- Importar A-Frame desde CDN -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* Estilo opcional para un título o instrucciones en pantalla */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="info-overlay">
        Haz clic y arrastra para explorar la escena 360°
    </div>

    <!-- Escena de A-Frame -->
    <a-scene embedded>
        <a-assets>
            <!-- Asegúrate de cambiar '2.webp' por la ruta correcta de tu imagen -->
            <img id="imagen360" src="2.webp" crossorigin="anonymous">
        </a-assets>

        <!-- Esfera de fondo que mapea la imagen 360 -->
        <a-sky src="#imagen360" rotation="0 -90 0"></a-sky>

        <!-- Cámara con controles de ratón y táctiles predeterminados -->
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>

</body>
</html>
